[workspace]
members = [
    "crates/yshell-app",
    "crates/yshell-ui",
    "crates/yshell-core",
    "crates/yshell-ssh",
    "crates/yshell-sftp",
    "crates/yshell-terminal",
    "crates/yshell-config",
    "crates/yshell-secret",
    "crates/yshell-logging",
    "crates/yshell-test-support",
    "xtask",
]
# Keep the build tool out of plain `cargo build`/`cargo test` runs.
default-members = [
    "crates/yshell-app",
    "crates/yshell-ui",
    "crates/yshell-core",
    "crates/yshell-ssh",
    "crates/yshell-sftp",
    "crates/yshell-terminal",
    "crates/yshell-config",
    "crates/yshell-secret",
    "crates/yshell-logging",
    "crates/yshell-test-support",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
time = { version = "0.3.47", features = ["local-offset", "formatting", "macros"] }
swash = "0.2.10"
rfd = { version = "0.17.2", default-features = false }
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "encryption", "ecdsa"] }
