[workspace]
members = [
    "crates/yshell-app",
    "crates/yshell-ui",
    "crates/yshell-core",
    "crates/yshell-ssh",
    "crates/yshell-sftp",
    "crates/yshell-terminal",
    "crates/yshell-config",
    "crates/yshell-secret",
    "crates/yshell-logging",
    "crates/yshell-test-support",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
