[package]
name = "yshell-sftp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# See yshell-ssh: openssl-on-win32 is required so Windows builds do not use
# libssh2's WinCNG backend (no curve25519/ECDH), which fails against OpenSSH >= 10.
ssh2 = { version = "0.9.5", features = ["vendored-openssl", "openssl-on-win32"] }
yshell-ssh = { path = "../yshell-ssh" }

[dev-dependencies]
tempfile.workspace = true
