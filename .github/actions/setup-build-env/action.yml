name: Set up build environment
description: >-
  Install the Rust toolchain, platform build prerequisites and packaging
  tools, then restore the cargo cache. Every workflow uses this action so
  `cargo xtask` runs against the same environment locally and in CI.

inputs:
  targets:
    description: Space or comma separated Rust target triples to install.
    required: false
    default: ""
  components:
    description: Comma separated rustup components, e.g. rustfmt or clippy.
    required: false
    default: ""
  extra-linux-packages:
    description: Extra apt packages for this job, e.g. rpm for rpm packages.
    required: false
    default: ""
  cache-key:
    description: Extra cache key component, e.g. the job name.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libssl-dev \
          libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          libfontconfig1-dev libgtk-3-dev \
          ${{ inputs.extra-linux-packages }}

    - name: Install Windows build prerequisites
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # ssh2 uses vendored OpenSSL, which needs Perl and NASM on Windows.
        if (-not (Get-Command perl -ErrorAction SilentlyContinue)) {
          choco install strawberryperl -y --no-progress
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }
        if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Cache cargo and target directories
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}