name: Build artifacts

# Reusable workflow: build the portable archives and installers for every
# supported platform, upload them as separate Actions artifacts, and aggregate
# SHA256SUMS.txt. Called by ci.yml (packaging smoke test), release.yml
# (publish) and dev-build.yml (dev draft).

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Version label used in artifact names. Leave empty to use the tag
          name, YSHELL_RELEASE_VERSION or a dev label derived from the commit.
        required: false
        type: string
        default: ""
      retention-days:
        description: How long the uploaded artifacts are kept.
        required: false
        type: number
        default: 90
      platforms:
        description: >-
          JSON array of platform ids to build. Feature branches under
          `dev/<system>/...` pass a single platform here so packaging only
          builds that system; `dev` and releases keep the full matrix.
        required: false
        type: string
        default: '["windows-x86_64","macos-x86_64","macos-aarch64","linux-x86_64"]'
    secrets:
      MACOS_CERT_P12_BASE64:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
      MACOS_API_KEY_P8_BASE64:
        required: false
      MACOS_API_KEY_ID:
        required: false
      MACOS_API_ISSUER_ID:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    name: Plan build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Select platforms
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          ALL='[
            {"os":"windows-latest","target":"x86_64-pc-windows-msvc","platform":"windows-x86_64","formats":"portable,msi"},
            {"os":"macos-latest","target":"x86_64-apple-darwin","platform":"macos-x86_64","formats":"portable,dmg"},
            {"os":"macos-latest","target":"aarch64-apple-darwin","platform":"macos-aarch64","formats":"portable,dmg"},
            {"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","platform":"linux-x86_64","formats":"portable,deb,rpm"}
          ]'
          echo "requested platforms: $PLATFORMS"
          include=$(printf '%s' "$ALL" | jq -c --argjson wanted "$PLATFORMS" \
            '[.[] | select(.platform as $name | $wanted | index($name))]')
          echo "matrix: $include"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          targets: ${{ matrix.target }}
          cache-key: package-${{ matrix.platform }}
          # rpmbuild for the rpm package; deb uses cargo-deb below.
          extra-linux-packages: ${{ runner.os == 'Linux' && 'rpm' || '' }}

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Verify Cargo.lock is up to date
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && secrets.MACOS_CERT_P12_BASE64 != ''
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_API_KEY_P8_BASE64: ${{ secrets.MACOS_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/gterm-signing.keychain-db"
          cert_p12="$RUNNER_TEMP/gterm-cert.p12"
          keychain_pass=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$cert_p12"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$cert_p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm -f "$cert_p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          if [ -n "${MACOS_API_KEY_P8_BASE64:-}" ]; then
            api_key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$MACOS_API_KEY_P8_BASE64" | base64 --decode > "$api_key"
            chmod 600 "$api_key"
            echo "YSHELL_MACOS_API_KEY_PATH=$api_key" >> "$GITHUB_ENV"
          fi

      - name: Build portable archive and installers
        id: dist
        env:
          YSHELL_RELEASE_VERSION: ${{ inputs.version }}
          YSHELL_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          YSHELL_MACOS_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          YSHELL_MACOS_API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
        run: >-
          cargo xtask dist
          --target ${{ matrix.target }}
          --platform ${{ matrix.platform }}
          --formats ${{ matrix.formats }}

      - name: Clean up macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/gterm-cert.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [ -f "$RUNNER_TEMP/gterm-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/gterm-signing.keychain-db" || true
          fi

      # Portable and installer packages share one build, but are uploaded as
      # separate Actions artifacts so they can be downloaded independently.
      - name: Upload portable archive
        if: steps.dist.outputs.portable_package != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dist.outputs.portable_package }}
          path: |
            dist/*-portable.zip
            dist/*-portable.tar.gz
            dist/*-portable.zip.sha256
            dist/*-portable.tar.gz.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - name: Upload installers
        if: steps.dist.outputs.installer_package != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dist.outputs.installer_package }}
          path: |
            dist/*.msi
            dist/*.msi.sha256
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          find . -type f -name '*.sha256' -exec cat {} + | LC_ALL=C sort -k2 > SHA256SUMS.txt
          expected=$(find . -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.rpm' \) | wc -l)
          actual=$(wc -l < SHA256SUMS.txt)
          echo "packages: $expected, checksums: $actual"
          test "$expected" -eq "$actual"
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}