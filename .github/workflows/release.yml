name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "portable-*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version label used in artifact names (leave empty for a dev build
          derived from the commit).
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ inputs.version || '' }}
      retention-days: 90

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-artifacts -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.rpm' -o -name 'SHA256SUMS.txt' \) \
            -exec cp {} upload/ \;
          ls -l upload

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: upload/*
          generate_release_notes: true