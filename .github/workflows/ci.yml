name: CI

on:
  push:
    branches:
      - main
      - master
      - "release/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          components: rustfmt
          cache-key: fmt

      - name: Verify Cargo.lock is up to date
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check formatting
        run: cargo xtask fmt

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          components: clippy
          cache-key: lint

      - name: Run clippy
        run: cargo xtask lint

  test:
    name: ${{ matrix.mode == 'test' && 'Test' || 'Compile check' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      # The full suite runs once: a second and third full test run did not pay
      # for the compile time it added. The other platforms only need to prove
      # that their cfg, native dependencies and build scripts still compile;
      # run `cargo xtask test` there when touching platform-specific code.
      matrix:
        include:
          - os: ubuntu-latest
            mode: test
          - os: windows-latest
            mode: check
          - os: macos-latest
            mode: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-key: test-${{ matrix.os }}

      - name: Run tests
        if: matrix.mode == 'test'
        run: cargo xtask test

      - name: Compile-check the workspace
        if: matrix.mode == 'check'
        run: cargo check --workspace --all-targets --all-features --locked

  live-ssh:
    name: Live SSH/SFTP smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-key: live-ssh

      - name: Run live tests against a disposable sshd container
        run: bash scripts/test-ssh/run.sh test

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-key: deny

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo xtask deny

  # Same packaging code path as release.yml, so a broken installer or archive
  # is caught on the next push instead of at tag time. Skipped for PRs to keep
  # review feedback fast.
  package:
    name: Package
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-artifacts.yml
    with:
      retention-days: 7