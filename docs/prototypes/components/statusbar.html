<!DOCTYPE html>
<html lang="zh-CN" data-proto-autoboot>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Component — statusbar</title>
  <link rel="stylesheet" href="../_chrome.css">
  <link rel="stylesheet" href="../_proto.css">
  <style>
    body { margin: 0; background: var(--mica-tint); }
  </style>
</head>
<body data-proto-autoboot>
  <div class="statusbar" role="status">
    <span class="dot" aria-hidden="true"></span>
    <span data-q="left">Connected · 12ms</span>
    <span data-q="mid">Log: off</span>
    <span class="spacer"></span>
    <span data-q="enc">UTF-8</span>
    <span data-q="backend">native SSH</span>
  </div>
  <script src="../_embed.js"></script>
  <script>ProtoEmbed.boot({ toggle: false });</script>
</body>
</html>
