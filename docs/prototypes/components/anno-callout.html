<!DOCTYPE html>
<html lang="zh-CN" data-proto-autoboot>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Component — anno callout</title>
  <link rel="stylesheet" href="../_theme.css">
  <link rel="stylesheet" href="../_anno.css">
  <link rel="stylesheet" href="../_proto.css">
  <style>
    body { margin: 0; padding: 8px; background: var(--window-bg); height: 100%; }
    body.proto-embed-root { padding: 0; }
    .demo {
      position: relative;
      width: 100%;
      height: 160px;
      border: 1px dashed var(--layer-stroke);
      background: var(--card-fill);
    }
    .callouts { min-height: 160px; height: 160px; width: 200px; }
    .callout-a { top: 12px; }
    .callout-b { top: 88px; }
  </style>
</head>
<body data-proto-autoboot>
  <div class="demo" style="display:flex;gap:12px">
    <div style="flex:1;position:relative;border:1px solid var(--card-stroke);border-radius:8px;background:var(--mica-tint)">
      <span class="anno-tag" data-q="tag">A · message</span>
    </div>
    <ul class="callouts" aria-label="Callouts">
      <li class="callout callout-a">
        <strong data-q="a">A · Message</strong>
        <span data-q="a-body">侧栏 callout；与角标同字母同标题；在产品几何外。</span>
      </li>
      <li class="callout callout-b">
        <strong data-q="b">B · Note</strong>
        <span data-q="b-body">蓝色实现提示用 .anno-note，不占字母。</span>
      </li>
    </ul>
  </div>
  <script src="../_embed.js"></script>
  <script>ProtoEmbed.boot({ toggle: false });</script>
</body>
</html>
