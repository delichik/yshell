<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YShell — Known hosts · modals</title>
  <link rel="stylesheet" href="../form.css">
  <link rel="stylesheet" href="../_anno.css">
  <style>
    :root {
      --modal-w: 560px; --modal-h: 400px; --titlebar-h: 40px; --pad: 28px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: ui-sans-serif, system-ui, sans-serif; color: var(--line); background: #e8e8e8; }
    .meta { max-width: var(--modal-w); margin: 0 0 12px; font-size: 13px; color: var(--mute); line-height: 1.45; }
    .meta a { color: inherit; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--mute); margin-bottom: 10px; }
    .tools button {
      height: var(--ctrl-h); padding: 0 12px; border: 1px solid var(--line);
      background: var(--fill); font: inherit; cursor: pointer;
    }
    .tools button[aria-pressed="true"] { background: var(--soft); font-weight: 600; }
    .stage { overflow-x: auto; padding-bottom: 8px; }
    .modal {
      width: var(--modal-w); height: var(--modal-h); flex-shrink: 0;
      display: flex; flex-direction: column; background: var(--fill); border: 1px solid var(--line);
    }
    .modal[hidden] { display: none !important; }
    .titlebar {
      height: var(--titlebar-h); flex: 0 0 var(--titlebar-h);
      display: flex; align-items: center; padding: 0 8px 0 12px; gap: 8px;
      border-bottom: 1px solid var(--line);
    }
    .title { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cap { width: 40px; height: 24px; border: 1px solid var(--line); background: transparent; font-size: 10px; color: var(--line); padding: 0; }
    .m-body { flex: 1; min-height: 0; padding: var(--pad); display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
    .m-spacer { flex: 1; min-height: 8px; }
    .m-body .hint { margin: 0; font-size: 13px; }
    .m-body.single-field .input,
    .m-body.single-field .textarea,
    .m-body .input,
    .m-body .textarea { max-width: none; width: 100%; }
    .m-body .textarea { flex: 1 1 auto; min-height: var(--field-h-md); resize: none; }
    .ctl-with-btn { width: 100%; align-items: center; }
    .ctl-with-btn .input { flex: 1 1 auto; width: auto; max-width: none; }
    .rule { border: 0; border-top: 1px solid var(--line); margin: 0; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
    .legend { max-width: var(--modal-w); margin: 20px 0 0; padding: 12px 14px; border: 1px dashed var(--line); font-size: 12px; color: var(--mute); line-height: 1.55; }
    .legend ul { margin: 6px 0 0; padding-left: 1.2em; }
  </style>
</head>
<body>
  <p class="meta">Known Hosts 子窗 · 单字段无 form-row 缩进。 <a href="../forms.html">forms</a> · <a href="../annotations.html">annotations</a>。</p>
  <div class="tools" role="group" aria-label="Modal state">
    <button type="button" id="state-add" aria-pressed="true" title="Add">Add</button>
    <button type="button" id="state-import" aria-pressed="false" title="Import">Import</button>
    <button type="button" id="state-export" aria-pressed="false" title="Export">Export</button>
  </div>

  <div class="stage">
    <div class="modal" id="modal-add" role="dialog">
      <div class="titlebar">
        <div class="title">Add Known Host</div>
        <button type="button" class="cap" tabindex="-1" aria-hidden="true"><span class="i i-close" aria-hidden="true"></span></button>
      </div>
      <div class="m-body">
        <textarea class="textarea" placeholder="host:port ssh-ed25519 AAAA…   or   host:port SHA256:…" aria-label="Entries"></textarea>
        <hr class="rule" />
        <div class="actions">
          <a class="btn" href="index.html" title="Cancel">Cancel</a>
          <button type="button" class="btn btn-primary" title="Add">Add</button>
        </div>
      </div>
    </div>

    <div class="modal" id="modal-import" role="dialog" hidden>
      <div class="titlebar">
        <div class="title">Import Known Hosts</div>
        <button type="button" class="cap" tabindex="-1" aria-hidden="true"><span class="i i-close" aria-hidden="true"></span></button>
      </div>
      <div class="m-body">
        <div class="ctl-with-btn">
          <input class="input" readonly placeholder="Path to known_hosts" aria-label="File" />
          <button type="button" class="btn btn-icon" title="Browse" aria-label="Browse"><span class="i i-browse" aria-hidden="true"></span></button>
        </div>
        <div class="m-spacer"></div>
        <hr class="rule" />
        <div class="actions">
          <a class="btn" href="index.html" title="Cancel">Cancel</a>
          <button type="button" class="btn btn-primary" title="Import">Import</button>
        </div>
      </div>
    </div>

    <div class="modal" id="modal-export" role="dialog" hidden>
      <div class="titlebar">
        <div class="title">Export Known Hosts</div>
        <button type="button" class="cap" tabindex="-1" aria-hidden="true"><span class="i i-close" aria-hidden="true"></span></button>
      </div>
      <div class="m-body">
        <div class="ctl-with-btn">
          <input class="input" readonly value="C:\Users\alice\known_hosts_export" aria-label="Destination" />
          <button type="button" class="btn btn-icon" title="Browse" aria-label="Browse"><span class="i i-browse" aria-hidden="true"></span></button>
        </div>
        <div class="m-spacer"></div>
        <hr class="rule" />
        <div class="actions">
          <a class="btn" href="index.html" title="Cancel">Cancel</a>
          <button type="button" class="btn btn-primary" title="Export">Export</button>
        </div>
      </div>
    </div>
  </div>

  <div class="legend">
      <ul class="anno">
        <li><strong>A · Single-field</strong> Add / Import / Export：无左侧 label，控件顶满。</li>
      </ul>
      <p class="anno-ref"><a href="../forms.html">forms</a> · <a href="../annotations.html">annotations</a></p>
    </div>

  <script>
    (function () {
      var map = {
        add: { btn: "state-add", modal: "modal-add" },
        import: { btn: "state-import", modal: "modal-import" },
        export: { btn: "state-export", modal: "modal-export" }
      };

      function show(name) {
        Object.keys(map).forEach(function (k) {
          var on = k === name;
          document.getElementById(map[k].btn).setAttribute("aria-pressed", on ? "true" : "false");
          document.getElementById(map[k].modal).hidden = !on;
        });
      }

      document.getElementById("state-add").addEventListener("click", function () { show("add"); });
      document.getElementById("state-import").addEventListener("click", function () { show("import"); });
      document.getElementById("state-export").addEventListener("click", function () { show("export"); });

      var hash = (location.hash || "").replace(/^#/, "");
      if (hash === "import" || hash === "export" || hash === "add") show(hash);
    })();
  </script>
</body>
</html>
