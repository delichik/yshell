<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YShell — UI prototypes</title>
  <style>
    :root {
      --line: #111;
      --fill: #fff;
      --mute: #555;
      --soft: #f0f0f0;
      --bg: #e8e8e8;
      --nav-w: 300px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: var(--line);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .top {
      flex: 0 0 auto;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--fill);
    }
    .top h1 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 600;
    }
    .top .lead {
      margin: 0;
      font-size: 12px;
      color: var(--mute);
      line-height: 1.4;
    }
    .top .lead a { color: var(--line); }
    .shell {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
    }
    .nav {
      width: var(--nav-w);
      flex-shrink: 0;
      border-right: 1px solid var(--line);
      background: var(--fill);
      overflow: auto;
      padding: 8px 0 24px;
    }
    .group {
      margin: 12px 0 4px;
      padding: 0 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .group .size {
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
    }
    .nav button.item {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
      color: inherit;
    }
    .nav button.item:hover { background: var(--soft); }
    .nav button.item[aria-current="true"] {
      background: var(--soft);
      font-weight: 600;
      outline: 1px solid var(--line);
      outline-offset: -1px;
    }
    .nav button.item .name {
      display: block;
      font-size: 13px;
      font-weight: inherit;
    }
    .nav button.item .desc {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      color: var(--mute);
      font-weight: 400;
      line-height: 1.35;
    }
    .stage {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #ddd;
    }
    .stage-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--fill);
      font-size: 12px;
      color: var(--mute);
    }
    .stage-bar strong { color: var(--line); font-weight: 600; }
    .stage-bar a {
      color: var(--line);
      margin-left: auto;
      font-size: 12px;
    }
    .frame-wrap {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>YShell UI prototypes</h1>
    <p class="lead">
      左侧选原型，右侧 iframe 预览。规则：<code>docs/agents/prototypes.md</code> ·
      注释约定：<a href="annotations.html">annotations</a> ·
      表单控件：<a href="forms.html">forms</a>（样式源 <code>form.css</code>）。
      也可 <a id="open-tab" href="#" target="_blank" rel="noopener">新标签打开当前项</a>。
    </p>
  </header>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="Prototype list"></nav>
    <div class="stage">
      <div class="stage-bar">
        <span>Preview · <strong id="cur-name">—</strong></span>
        <span id="cur-desc"></span>
        <a id="open-src" href="#" target="_blank" rel="noopener">Open source file</a>
      </div>
      <div class="frame-wrap">
        <iframe id="frame" title="Prototype preview" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var GROUPS = [
        {
          title: "Meta",
          size: "shared",
          items: [
            { href: "annotations.html", name: "annotations", desc: "注释格式 · 通用 chrome/spacer/footer" },
            { href: "forms.html", name: "forms", desc: "表单控件规范 · form.css 唯一样式源" }
          ]
        },
        {
          title: "Main shell",
          size: "main-shell/",
          items: [
            { href: "main-shell/index.html", name: "main-shell", desc: "整壳拼装 · 菜单/快捷键枢纽" },
            { href: "main-shell/tool-dock.html", name: "main-shell/tool-dock", desc: "Left/Right stack · Move L/R" },
            { href: "main-shell/panels/sessions.html", name: "main-shell/panels/sessions", desc: "Sessions · 右键 · 原地改名 · session.icon" },
            { href: "main-shell/panels/transfers.html", name: "main-shell/panels/transfers", desc: "Transfers · Pause/Cancel" },
            { href: "main-shell/panels/tunnels.html", name: "main-shell/panels/tunnels", desc: "Tunnels · Add → tunnel-editor" },
            { href: "main-shell/panels/commands.html", name: "main-shell/panels/commands", desc: "Commands 空态" },
            { href: "main-shell/workspace/tab-bar.html", name: "main-shell/workspace/tab-bar", desc: "标签条 · 原地 Rename · session.icon" },
            { href: "main-shell/workspace/terminal.html", name: "main-shell/workspace/terminal", desc: "终端 · 查找 · REC" },
            { href: "main-shell/workspace/sftp.html", name: "main-shell/workspace/sftp", desc: "双栏 SFTP · 拖放" },
            { href: "main-shell/workspace/quick-connect.html", name: "main-shell/workspace/quick-connect", desc: "QC 表单 + Recent" },
            { href: "main-shell/workspace/split.html", name: "main-shell/workspace/split", desc: "分屏 1/2/4" },
            { href: "main-shell/workspace/sync-input.html", name: "main-shell/workspace/sync-input", desc: "N9 · 无 KEYS 确认" }
          ]
        },
        {
          title: "Compact",
          size: "560×400",
          items: [
            { href: "compact-confirm/index.html", name: "compact-confirm", desc: "确认 · 普通 / 破坏性 / 多行粘贴" },
            { href: "close-tab-confirm/index.html", name: "close-tab-confirm", desc: "关标签 / Quit" },
            { href: "host-key/index.html", name: "host-key", desc: "Host key 信任（compact）" },
            { href: "sftp-chmod/index.html", name: "sftp-chmod", desc: "SFTP 权限：八进制 + 勾选框" }
          ]
        },
        {
          title: "Standard",
          size: "720×580",
          items: [
            { href: "auth-prompt/index.html", name: "auth-prompt", desc: "Password / Key / Challenge" },
            { href: "logging/index.html", name: "logging", desc: "日志启停" },
            { href: "about/index.html", name: "about", desc: "About" },
            { href: "sftp-conflict/index.html", name: "sftp-conflict", desc: "覆盖冲突" },
            { href: "sftp-properties/index.html", name: "sftp-properties", desc: "属性" },
            { href: "tunnel-editor/index.html", name: "tunnel-editor", desc: "隧道编辑" }
          ]
        },
        {
          title: "Wide",
          size: "1100×820",
          items: [
            { href: "settings/index.html", name: "settings", desc: "整壳 hub · 分区只标跳转" },
            { href: "settings/sections/general.html", name: "settings/sections/general", desc: "General · language / confirmations / motion" },
            { href: "settings/sections/appearance.html", name: "settings/sections/appearance", desc: "Appearance · app theme · terminal style" },
            { href: "settings/sections/terminal.html", name: "settings/sections/terminal", desc: "Terminal · scrollback · mouse · paste" },
            { href: "settings/sections/security.html", name: "settings/sections/security", desc: "Security · master password · managers" },
            { href: "settings/master-password.html", name: "settings/master-password", desc: "Master password · Set/Change/Remove/Reset" },
            { href: "settings/master-password-unlock.html", name: "settings/master-password-unlock", desc: "Master password · startup unlock + error" },
            { href: "settings/sections/mcp.html", name: "settings/sections/mcp", desc: "MCP · enable / listen / access" },
            { href: "settings/mcp-consent.html", name: "settings/mcp-consent", desc: "MCP · Allow AI control 确认" },
            { href: "settings/sections/advanced.html", name: "settings/sections/advanced", desc: "Advanced · debug · config directory" },
            { href: "settings/sections/sftp.html", name: "settings/sections/sftp", desc: "Show hidden · Conflict · External editor" },
            { href: "session-editor/index.html", name: "session-editor", desc: "整壳 hub · 分区只标跳转" },
            { href: "session-editor/sections/general.html", name: "session-editor/sections/general", desc: "General · Icon" },
            { href: "session-editor/sections/authentication.html", name: "session-editor/sections/authentication", desc: "Auth · Inherit" },
            { href: "session-editor/sections/login-script.html", name: "session-editor/sections/login-script", desc: "Login Script 列表" },
            { href: "session-editor/sections/login-step-keys.html", name: "session-editor/sections/login-step-keys", desc: "Login Script · Keys 弹窗" },
            { href: "session-editor/sections/login-step-wait.html", name: "session-editor/sections/login-step-wait", desc: "Login Script · Wait 弹窗" },
            { href: "session-editor/sections/proxy.html", name: "session-editor/sections/proxy", desc: "Proxy · 管理" },
            { href: "session-editor/sections/tunnels.html", name: "session-editor/sections/tunnels", desc: "Tunnels · 右键 Edit/Duplicate/Delete" },
            { href: "session-editor/sections/terminal-style.html", name: "session-editor/sections/terminal-style", desc: "Terminal Style · 预览对齐 styles 管理器" },
            { href: "terminal-styles/index.html", name: "terminal-styles", desc: "终端样式" },
            { href: "known-hosts/index.html", name: "known-hosts", desc: "Known Hosts" },
            { href: "known-hosts/modals.html", name: "known-hosts/modals", desc: "Known Hosts 子窗" },
            { href: "private-keys/index.html", name: "private-keys", desc: "Private Keys" },
            { href: "private-keys/modals.html", name: "private-keys/modals", desc: "Private Keys 子窗" },
            { href: "proxies/index.html", name: "proxies", desc: "Proxies" }
          ]
        }
      ];

      var nav = document.getElementById("nav");
      var frame = document.getElementById("frame");
      var curName = document.getElementById("cur-name");
      var curDesc = document.getElementById("cur-desc");
      var openSrc = document.getElementById("open-src");
      var openTab = document.getElementById("open-tab");
      var buttons = [];

      function selectItem(item, btn) {
        buttons.forEach(function (b) { b.setAttribute("aria-current", "false"); });
        btn.setAttribute("aria-current", "true");
        frame.src = item.href;
        curName.textContent = item.name;
        curDesc.textContent = item.desc || "";
        openSrc.href = item.href;
        openTab.href = item.href;
        try {
          history.replaceState(null, "", "#" + encodeURIComponent(item.href));
        } catch (e) {}
      }

      GROUPS.forEach(function (g) {
        var label = document.createElement("div");
        label.className = "group";
        label.innerHTML = g.title + (g.size ? ' <span class="size">' + g.size + "</span>" : "");
        nav.appendChild(label);
        g.items.forEach(function (item) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "item";
          btn.title = item.name + (item.desc ? " — " + item.desc : "");
          btn.innerHTML =
            '<span class="name">' + item.name + "</span>" +
            '<span class="desc">' + item.desc + "</span>";
          btn.addEventListener("click", function () { selectItem(item, btn); });
          nav.appendChild(btn);
          buttons.push(btn);
          item._btn = btn;
        });
      });

      var hash = (location.hash || "").replace(/^#/, "");
      var start = null;
      if (hash) {
        try { hash = decodeURIComponent(hash); } catch (e) {}
        GROUPS.some(function (g) {
          return g.items.some(function (it) {
            if (it.href === hash) { start = it; return true; }
            return false;
          });
        });
      }
      if (!start) start = GROUPS[0].items[0];
      selectItem(start, start._btn);
      start._btn.scrollIntoView({ block: "nearest" });
    })();
  </script>
</body>
</html>
