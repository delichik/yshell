<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YShell — Close tab / quit confirm UI</title>
  <link rel="stylesheet" href="../_theme.css">
  <link rel="stylesheet" href="../_proto.css">
  <link rel="stylesheet" href="../_anno.css">
</head>
<body class="proto-body">
  <label class="proto-theme-toggle"><input type="checkbox" id="theme-toggle" /> Dark theme</label>
  <p class="proto-meta">
    Close tab / Quit · iframe → <a href="../components/tool-window.html"><code>components/tool-window.html</code></a>
    + query。<a href="../components.html">components</a>
  </p>
  <div class="proto-tools" role="group" aria-label="Prototype state">
    <label><input type="radio" name="state" value="tab" checked /> Close tab</label>
    <label><input type="radio" name="state" value="quit" /> Quit app</label>
  </div>
  <div class="proto-stage">
    <iframe
      id="frame"
      class="proto-embed proto-embed--compact"
      data-proto-embed
      title="Close tab confirm"
      src="../components/tool-window.html?embed=1&amp;tier=compact"
    ></iframe>
  </div>
  <div class="proto-legend">
    <ul class="anno">
      <li><strong>A · Same shell</strong> 与 compact-confirm 共用 tool-window 真源。</li>
    </ul>
  </div>
  <script src="../_embed.js"></script>
  <script>
    ProtoEmbed.boot();
    (function () {
      var STATES = {
        tab: {
          title: "Close tab — prod-edge",
          message: "Close this tab? The session will disconnect.",
          primary: "Close tab",
          secondary: "Cancel"
        },
        quit: {
          title: "Quit YShell?",
          message: "Quit and close all sessions?",
          primary: "Quit",
          secondary: "Cancel"
        }
      };
      var frame = document.getElementById("frame");
      function apply(state) {
        var s = STATES[state] || STATES.tab;
        var q = new URLSearchParams({
          embed: "1",
          tier: "compact",
          title: s.title,
          message: s.message,
          primary: s.primary,
          secondary: s.secondary,
          theme: document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"
        });
        frame.src = "../components/tool-window.html?" + q.toString();
      }
      document.querySelectorAll('input[name="state"]').forEach(function (el) {
        el.addEventListener("change", function () {
          if (el.checked) apply(el.value);
        });
      });
      apply("tab");
      var toggle = document.getElementById("theme-toggle");
      if (toggle) {
        toggle.addEventListener("change", function () {
          var cur = document.querySelector('input[name="state"]:checked');
          apply(cur ? cur.value : "tab");
        });
      }
    })();
  </script>
</body>
</html>
