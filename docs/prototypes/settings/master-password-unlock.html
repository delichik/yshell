<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YShell — Unlock with master password</title>
  <link rel="stylesheet" href="../form.css">
  <link rel="stylesheet" href="../_proto.css">
  <link rel="stylesheet" href="../_chrome.css">
  <link rel="stylesheet" href="../_proto.css">
  <link rel="stylesheet" href="../_icons.css">
  <link rel="stylesheet" href="../_anno.css">
  <style>
    /* Theme.tool-window-*-compact */
    :root {
      --modal-w: 560px; --modal-h: 400px; --titlebar-h: 32px; --pad: 28px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: ui-sans-serif, system-ui, sans-serif; color: var(--text-primary); background: var(--window-bg); }
    .meta { max-width: var(--modal-w); margin: 0 0 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.45; }
    .meta a { color: var(--text-primary); font-weight: 600; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
    .tools label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .stage { overflow-x: auto; padding-bottom: 8px; }
    .win {
      width: var(--modal-w); height: var(--modal-h); flex-shrink: 0;
      display: flex; flex-direction: column;
    }
    .m-body { flex: 1; min-height: 0; padding: var(--pad); display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
    .intro { margin: 0; font-size: 14px; }
    .error {
      display: none; padding: 8px 10px; border: 1px solid var(--card-stroke); background: var(--subtle-hover);
      font-size: 13px; line-height: 1.4;
    }
    .root.show-error .error { display: block; }
    .forgot { margin: 0; text-align: right; }
    .forgot a { font-size: 13px; color: var(--danger); }
    .m-spacer { flex: 1; min-height: 8px; }
    .rule { border: 0; border-top: 1px solid var(--layer-stroke); margin: 0; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body class="proto-body">
  
  <label class="proto-theme-toggle"><input type="checkbox" id="theme-toggle" /> Dark theme</label>
<div class="root" id="root">
    <p class="meta">Master password · 启动解锁 · compact <code>560×400</code>。 ← <a href="sections/security.html">sections/security</a> · <a href="master-password.html#reset">reset flow</a></p>
    <div class="tools" role="group" aria-label="Unlock demo state">
      <label><input type="checkbox" id="toggle-error" /> Wrong password</label>
    </div>

    <div class="stage">
      <div class="win win-compact" role="dialog" aria-labelledby="unlock-title">
        <div class="titlebar">
          <div class="title" id="unlock-title">Master Password Required</div>
          <button type="button" class="cap" title="Quit YShell" aria-label="Quit YShell"><span class="i i-close" aria-hidden="true"></span></button>
        </div>
        <div class="m-body">
          <p class="intro">Enter your master password.</p>
          <div class="error" role="alert">Incorrect password.</div>
          <div class="field-row">
            <input class="input" id="unlock-password" type="password" autocomplete="current-password"
                   placeholder="Master password" aria-label="Master password" />
          </div>
          <p class="forgot"><a href="master-password.html#reset" title="Reset master password">Forgot password?</a></p>
          <div class="m-spacer"></div>
          <hr class="rule" />
          <div class="actions">
            <button type="button" class="btn" title="Quit YShell">Quit</button>
            <button type="button" class="btn btn-primary" title="Unlock">Unlock</button>
          </div>
        </div>
      </div>
    </div>

    <div class="legend">
      <ul class="anno">
        <li><strong>A · Unlock</strong> 单字段；错误就地显示。</li>
        <li><strong>B · Forgot</strong> → <a href="master-password.html#reset">Reset</a>。</li>
        <li><strong>C · Quit</strong> 退出，不读取文件。</li>
      </ul>
      <p class="anno-ref"><a href="master-password.html">master-password</a> · <a href="../forms.html">forms</a> · <a href="../annotations.html">annotations</a></p>
    </div>
  </div>
  <script>
    (function () {
      var root = document.getElementById("root");
      var toggle = document.getElementById("toggle-error");
      toggle.addEventListener("change", function () {
        root.classList.toggle("show-error", toggle.checked);
      });
    })();
  </script>
<script src="../_proto.js"></script>
<script>enableProtoThemeToggle();</script>
</body>
</html>
