<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YShell — Compact confirm UI</title>
  <link rel="stylesheet" href="../_theme.css">
  <link rel="stylesheet" href="../_proto.css">
  <link rel="stylesheet" href="../_anno.css">
</head>
<body class="proto-body">
  <label class="proto-theme-toggle"><input type="checkbox" id="theme-toggle" /> Dark theme</label>
  <p class="proto-meta">
    Compact confirm · iframe → <a href="../components/tool-window.html"><code>components/tool-window.html</code></a>
    + query（<code>title</code> / <code>message</code> / <code>primary</code>）。
    <a href="../annotations.html">annotations</a> ·
    <a href="../components.html">components</a>
  </p>
  <div class="proto-tools" role="group" aria-label="Prototype state">
    <label><input type="radio" name="state" value="normal" checked /> Normal confirm</label>
    <label><input type="radio" name="state" value="destructive" /> Destructive (delete / clear)</label>
    <label><input type="radio" name="state" value="paste" /> Multi-line paste</label>
  </div>
  <div class="proto-stage">
    <iframe
      id="frame"
      class="proto-embed proto-embed--compact"
      data-proto-embed
      title="Compact confirm"
      src="../components/tool-window.html?embed=1&amp;tier=compact"
    ></iframe>
  </div>
  <div class="proto-legend">
    <ul class="anno">
      <li><strong>A · Message</strong> 后果正文；无手输确认词。真源只有 tool-window 一份。</li>
      <li><strong>B · Params</strong> 切换上方状态只改 query，不复制 DOM。</li>
    </ul>
  </div>
  <script src="../_embed.js"></script>
  <script>
    ProtoEmbed.boot();
    (function () {
      var STATES = {
        normal: {
          title: "Disconnect",
          message: "Close the active session to web-01? Unsaved work in the terminal is not preserved.",
          primary: "Confirm",
          secondary: "Cancel"
        },
        destructive: {
          title: "Delete",
          message: "Delete selected items permanently? This cannot be undone.",
          primary: "Delete",
          secondary: "Cancel"
        },
        paste: {
          title: "Paste 128 lines?",
          message: "Paste a large multi-line block into the terminal?",
          primary: "Paste",
          secondary: "Cancel"
        }
      };
      var frame = document.getElementById("frame");
      function apply(state) {
        var s = STATES[state] || STATES.normal;
        var u = new URL("../components/tool-window.html", location.href);
        u.searchParams.set("embed", "1");
        u.searchParams.set("tier", "compact");
        u.searchParams.set("title", s.title);
        u.searchParams.set("message", s.message);
        u.searchParams.set("primary", s.primary);
        u.searchParams.set("secondary", s.secondary);
        var theme = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
        u.searchParams.set("theme", theme);
        frame.src = u.pathname.replace(/^\//, "") + "?" + u.searchParams.toString();
        // Prefer relative path for file/http both
        frame.src = "../components/tool-window.html?" + u.searchParams.toString();
      }
      document.querySelectorAll('input[name="state"]').forEach(function (el) {
        el.addEventListener("change", function () {
          if (el.checked) apply(el.value);
        });
      });
      apply("normal");
      var toggle = document.getElementById("theme-toggle");
      if (toggle) {
        toggle.addEventListener("change", function () {
          var cur = document.querySelector('input[name="state"]:checked');
          apply(cur ? cur.value : "normal");
        });
      }
    })();
  </script>
</body>
</html>
